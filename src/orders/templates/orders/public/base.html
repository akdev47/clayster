{% load static %}<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="{% static 'images/Clayster_Makersmark_Textuur_MARGE.png' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {# These pages are reached by a secret link: keep them out of search results and referrers. #}
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'stamp_generator/images/favicon-32.png' %}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'stamp_generator/images/favicon-16.png' %}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'stamp_generator/images/apple-touch-icon.png' %}" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="{% static 'stamp_generator/css/style.css' %}" />
    <style>
      .public-page { max-width: 760px; }
      .public-card { padding: 1.4rem; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
      .public-card + .public-card { margin-top: 1rem; }
      .public-card h2 { margin-bottom: .9rem; font-size: 1.05rem; font-weight: 700; }
      .public-notice { padding: .8rem 1rem; background: var(--yellow); border-radius: var(--radius); font-size: .9rem; }
      .public-status { display: inline-block; padding: .25rem .7rem; color: #173f3e; background: var(--aqua); border-radius: 999px; font-size: .85rem; font-weight: 700; }
      .public-status.waiting { background: var(--yellow); color: var(--ink); }
      .public-status.cancelled { background: #f6c9bb; color: var(--coral-dark); }
      .public-items { width: 100%; font-size: .9rem; }
      .public-items th { color: var(--muted); font-weight: 500; }
      .public-items th, .public-items td { padding: .35rem 0; }
      .public-items .num { text-align: right; font-variant-numeric: tabular-nums; }
      .public-link { width: 100%; padding: .55rem .7rem; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: .85rem; }
      .public-page.confirmation-page { max-width: 1100px; padding-top: .65rem !important; padding-bottom: 0 !important; }
      .confirmation-panel { padding: 1rem 1.5rem; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
      .confirmation-header { text-align: center; }
      .confirmation-check { display: grid; width: 46px; height: 46px; margin: 0 auto .45rem; place-items: center; color: var(--success); border: 3px solid currentColor; border-radius: 50%; }
      .confirmation-check.waiting { color: var(--warning); }
      .confirmation-check svg { width: 25px; height: 25px; }
      .confirmation-header h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 1.85rem); font-weight: 700; }
      .confirmation-message { margin: .25rem auto 0; color: var(--muted); font-size: .88rem; }
      .confirmation-state { display: flex; align-items: center; justify-content: center; gap: .5rem; margin-top: .45rem; }
      .confirmation-summary { display: grid; grid-template-columns: repeat(2, 1fr); max-width: 900px; margin: .7rem auto 0; border: 1px solid var(--border); border-radius: var(--radius); }
      .confirmation-summary > div { padding: .55rem .9rem; text-align: left; }
      .confirmation-summary > div + div { border-left: 1px solid var(--border); }
      .confirmation-summary dt { color: var(--muted); font-size: .72rem; font-weight: 600; }
      .confirmation-summary dd { margin: .1rem 0 0; font-size: .95rem; font-weight: 700; }
      .confirmation-items { max-width: 900px; margin: .75rem auto 0; border: 1px solid var(--border); border-radius: var(--radius); }
      .confirmation-items h2 { margin: 0; padding: .6rem .9rem; border-bottom: 1px solid var(--border); font-size: .9rem; font-weight: 700; }
      .confirmation-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: center; padding: .6rem .9rem; }
      .confirmation-item + .confirmation-item { border-top: 1px solid var(--border); }
      .confirmation-item-name { margin: 0; font-weight: 700; }
      .confirmation-item-description, .confirmation-item-quantity { margin: .15rem 0 0; color: var(--muted); font-size: .78rem; }
      .confirmation-item-price { font-weight: 700; font-variant-numeric: tabular-nums; }
      .confirmation-totals { padding: .45rem .9rem .55rem; border-top: 1px solid var(--border); font-size: .82rem; }
      .confirmation-totals .order-price-row { margin-top: .12rem; }
      .confirmation-payment { max-width: 900px; }
      .confirmation-details { display: grid; grid-template-columns: .8fr 1.2fr; gap: .6rem; max-width: 900px; margin: .6rem auto 0; }
      .confirmation-details .public-card { min-width: 0; margin: 0; padding: .65rem .85rem; }
      .confirmation-details .public-card h2 { margin-bottom: .3rem; font-size: .88rem; }
      .confirmation-details .public-card p { margin-bottom: .25rem; font-size: .72rem; }
      .confirmation-details .public-link { padding: .35rem .55rem; font-size: .72rem; }
      .confirmation-action { max-width: 900px; margin: .6rem auto 0; }
      .confirmation-action .primary-button { min-height: 42px; margin: 0; text-decoration: none; }
      .payment-success-overlay { position: fixed; z-index: 1000; inset: 0; display: grid; padding: 1.5rem; place-items: center; background: rgb(48 45 42 / 42%); opacity: 0; backdrop-filter: blur(4px); transition: opacity .32s ease; }
      .payment-success-overlay.show { opacity: 1; }
      .payment-success-card { min-width: min(320px, 100%); padding: 2rem; color: var(--ink); background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 18px 55px rgb(48 45 42 / 22%); opacity: 0; text-align: center; transform: translateY(18px) scale(.78); }
      .payment-success-overlay.show .payment-success-card { animation: payment-success-pop .75s cubic-bezier(.2, .9, .25, 1.18) forwards; }
      .payment-success-icon { display: grid; width: 78px; height: 78px; margin: 0 auto 1rem; place-items: center; color: var(--success); border: 5px solid currentColor; border-radius: 50%; }
      .payment-success-icon svg { width: 44px; height: 44px; }
      .payment-success-icon path { stroke-dasharray: 30; stroke-dashoffset: 30; }
      .payment-success-overlay.show .payment-success-icon path { animation: payment-success-check .5s .38s ease-out forwards; }
      .payment-success-card strong { display: block; font-size: 1.35rem; }
      .payment-success-card span { display: block; margin-top: .35rem; color: var(--muted); font-size: .85rem; }
      @keyframes payment-success-pop {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes payment-success-check {
        to { stroke-dashoffset: 0; }
      }
      @media (max-width: 767.98px) {
        .confirmation-panel { padding: 1.2rem .9rem; }
        .confirmation-summary { grid-template-columns: 1fr; }
        .confirmation-summary > div + div { border-top: 1px solid var(--border); border-left: 0; }
        .confirmation-details { grid-template-columns: 1fr; }
      }
      @media (prefers-reduced-motion: reduce) {
        .payment-success-overlay, .payment-success-card { transition: none; }
        .payment-success-overlay.show .payment-success-card { animation: none; opacity: 1; transform: none; }
        .payment-success-overlay.show .payment-success-icon path { animation: none; stroke-dashoffset: 0; }
      }
    </style>
    <title>{% block title %}Clayster{% endblock %}</title>
  </head>
  <body>
    <nav class="navbar clayster-navbar">
      <div class="container-fluid px-3 px-lg-5">
        <a class="navbar-brand clayster-logo" href="/">
          <picture>
            <source
              media="(max-width: 575.98px)"
              srcset="{% static 'stamp_generator/images/clayster-mobile-logo.png' %}"
            />
            <img
              class="clayster-logo-image"
              src="{% static 'stamp_generator/images/clayster-desktop-logo.png' %}"
              alt="Clayster"
            />
          </picture>
        </a>
      </div>
    </nav>

    {% block progress %}{% endblock %}

    <main class="container public-page {% block main_class %}{% endblock %} px-3 py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
