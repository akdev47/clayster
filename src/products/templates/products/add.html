{% extends "base.html" %}

{% block title %}Add product | Clayster{% endblock %}

{% block content %}

<div class="mb-4">
  <h1 class="h3 fw-semibold mb-1">Add a new product</h1>
  <p class="text-secondary mb-0">
    Add a new product to your webshop.
  </p>
</div>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}

  {% include "products/components/product_form.html" %}

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">
      Add product
    </button>

    <a href="{% url 'products:index' %}"
       class="btn btn-outline-secondary">
      Cancel
    </a>
  </div>
</form>

{% endblock %}
