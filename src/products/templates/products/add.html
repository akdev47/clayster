{% extends "base.html" %} {% block title %}Product {{ product.id}} | Clayster{%
endblock %} {% block content %}

<h1 class="h3 fw-semibold mb-1">Add a new product</h1>

<form method="post">
  {% csrf_token %}

  <div class="mb-3">
    <label for="{{ form.name.id_for_label }}" class="form-label"> Name </label>
    {{ form.name }}
  </div>

  <div class="mb-3">
    <label for="{{ form.description.id_for_label }}" class="form-label">
      Description
    </label>
    {{ form.description }}
  </div>

  <div class="mb-3">
    <label for="{{ form.price.id_for_label }}" class="form-label">
      Price
    </label>
    {{ form.price }}
  </div>

  <div class="mb-4">
    <label for="{{ form.product_type.id_for_label }}" class="form-label">
      Product type
    </label>
    {{ form.product_type }}
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Add product</button>

    <a href="{% url 'products:index' %}" class="btn btn-outline-secondary">
      Cancel
    </a>
  </div>
</form>
{% endblock %}
