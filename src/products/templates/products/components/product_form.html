{% if form.non_field_errors %}
  <div class="alert alert-danger">
    {{ form.non_field_errors }}
  </div>
{% endif %}

<div class="mb-3">
  <label for="{{ form.name.id_for_label }}" class="form-label">
    Name
  </label>
  {{ form.name }}
</div>

<div class="mb-3">
  <label for="{{ form.short_description.id_for_label }}" class="form-label">
    Short description
  </label>
  {{ form.short_description }}
</div>

<div class="mb-3">
  <label for="{{ form.long_description.id_for_label }}" class="form-label">
    Long description
  </label>
  {{ form.long_description }}
</div>

<div class="mb-3">
  <label for="{{ form.price.id_for_label }}" class="form-label">
    Price
  </label>
  {{ form.price }}
</div>

<div class="mb-3">
  <label for="{{ form.product_type.id_for_label }}" class="form-label">
    Product type
  </label>
  {{ form.product_type }}
</div>

<div class="mb-3">
  <label for="{{ form.category.id_for_label }}" class="form-label">
    Category
  </label>
  {{ form.category }}
</div>

<div class="mb-3">
  <div class="form-check form-switch">
    {{ form.on_website }}

    <label
      class="form-check-label"
      for="{{ form.on_website.id_for_label }}"
    >
      Show on website
    </label>
  </div>
</div>

<div class="mb-4">
  <label for="{{ form.file.id_for_label }}" class="form-label">
    STL file
  </label>
  {{ form.file }}
</div>
