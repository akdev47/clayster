{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script src="{% static 'vendor/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>

    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <meta charset="UTF-8" />
    <title>{% block title %}Clayster{% endblock %}</title>
  </head>
  <body class="clayster-admin">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="dashboard">
      {% include "components/sidebar.html" %}

      <main id="main-content" class="dashboard_content" tabindex="-1">
        {% if messages %}
          <div class="feedback" aria-live="polite">
            {% for message in messages %}
              <div class="alert {% if message.level_tag == 'error' %}alert-danger{% else %}alert-{{ message.level_tag|default:'info' }}{% endif %}" role="status">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
        {% block content %} {% endblock %}
      </main>
    </div>
  </body>
</html>
