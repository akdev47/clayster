{% extends "base.html" %}

{% block title %}Add production job | Clayster{% endblock %}

{% block content %}

<div class="mb-4">
  <h1 class="h3 fw-semibold mb-1">Add production job</h1>
  <p class="text-secondary mb-0">
    Add a product to the production queue.
  </p>
</div>

<form method="post">
  {% csrf_token %}

  <div class="mb-3">
    <label for="{{ form.product.id_for_label }}" class="form-label">
      Product
    </label>
    {{ form.product }}
  </div>

  <div class="mb-4">
    <label for="{{ form.quantity.id_for_label }}" class="form-label">
      Quantity
    </label>
    {{ form.quantity }}
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>
      Add to production queue
    </button>

    <a href="{% url 'production:index' %}"
       class="btn btn-outline-secondary">
      Cancel
    </a>
  </div>
</form>

{% endblock %}
